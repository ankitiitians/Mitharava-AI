version: '3.8'

services:

  mongodb:
    image: mongo:7.0
    container_name: mitharva-mongodb
    restart: unless-stopped

    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: MitharvaDB2026
      MONGO_INITDB_DATABASE: mitharva_ai

    volumes:
      - mongodb_data:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/init.js:ro

    ports:
      - "27017:27017"

    networks:
      - mitharva-network

    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 10s
      retries: 5


  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: mitharva-backend
    restart: unless-stopped

    environment:
      MONGO_URL: mongodb://admin:MitharvaDB2026@mongodb:27017/mitharva_ai?authSource=admin
      DB_NAME: mitharva_ai
      JWT_SECRET: change-me-in-production-32-chars

    ports:
      - "8001:8001"

    depends_on:
      mongodb:
        condition: service_healthy

    networks:
      - mitharva-network

    healthcheck:
      test: curl -f http://localhost:8001/api/health || exit 1
      interval: 30s
      timeout: 10s
      retries: 3


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

      args:
        REACT_APP_BACKEND_URL: http://172.236.164.91:8001

    container_name: mitharva-frontend
    restart: unless-stopped

    ports:
      - "3000:80"

    depends_on:
      - backend

    networks:
      - mitharva-network


  prometheus:
    image: prom/prometheus:latest
    container_name: mitharva-prometheus
    restart: unless-stopped

    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus

    command:
      - '--config.file=/etc/prometheus/prometheus.yml'

    ports:
      - "9090:9090"

    networks:
      - mitharva-network


  grafana:
    image: grafana/grafana:latest
    container_name: mitharva-grafana
    restart: unless-stopped

    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: MitharvaGrafana@2026

    volumes:
      - grafana_data:/var/lib/grafana

    ports:
      - "3001:3000"

    depends_on:
      - prometheus

    networks:
      - mitharva-network


  nginx:
    image: nginx:alpine
    container_name: mitharva-nginx
    restart: unless-stopped

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

    ports:
      - "8090:80"

    depends_on:
      - frontend
      - backend

    networks:
      - mitharva-network


volumes:
  mongodb_data:
  prometheus_data:
  grafana_data:


networks:
  mitharva-network:
    driver: bridge
